name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GORELEASER_VERSION: v2.18.3
  TRIVY_VERSION: v0.75.0

jobs:
  patch:
    name: patch
    uses: ./.github/workflows/patch.yml
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security:
    name: security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  build:
    name: build and scan the image
    needs: [patch, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: goreleaser (snapshot, nothing published)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=docker,sign,sbom
        env:
          DOCKERHUB_USERNAME: snapshot
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: image build context (same layout as goreleaser dockers_v2)
        run: |
          mkdir -p ctx/linux/amd64 ctx/linux/arm64
          cp Dockerfile LICENSE NOTICE ctx/
          cp dist/localrectl_linux_amd64_v1/localrectl ctx/linux/amd64/
          cp dist/localrectl_linux_arm64_v8.0/localrectl ctx/linux/arm64/
      - name: build image linux/arm64
        run: docker buildx build --platform linux/arm64 ctx
      - name: build image linux/amd64
        run: docker buildx build --platform linux/amd64 --load -t localrectl:ci ctx
      - name: smoke test
        run: |
          docker run --rm localrectl:ci version
          docker run --rm localrectl:ci --help
          test "$(docker inspect -f '{{.Config.User}}' localrectl:ci)" = "localrectl:localrectl"
      - name: trivy image gate (HIGH/CRITICAL with a fix, secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: localrectl:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  publish:
    name: GitHub release, Docker Hub and ghcr.io
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write # create the GitHub release
      id-token: write # cosign keyless signatures (Sigstore)
      packages: write # push the image to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: goreleaser release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
