version: 2

project_name: localrectl

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: localrectl
    main: ./cmd
    binary: localrectl
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids: [localrectl]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - schema/gr-artifacts.schema.json

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

# SBOM (SPDX) of each archive, generated by syft.
sboms:
  - artifacts: archive

# Keyless signature (Sigstore, GitHub OIDC) of the checksums file: verifying it covers every archive.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "--yes", "${artifact}"]

dockers_v2:
  - id: docker-image
    ids: [localrectl]
    dockerfile: Dockerfile
    extra_files: [LICENSE, NOTICE]
    images:
      - "docker.io/{{ .Env.DOCKERHUB_USERNAME }}/localrectl"
      - "ghcr.io/nivekalara237/localrectl"
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    sbom: true
    labels:
      org.opencontainers.image.title: local-registry
      org.opencontainers.image.description: localrectl is the command-line client of local-registry
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.name: "{{ .ProjectName }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.base.name: "{{ .BaseImage }}"
      org.opencontainers.image.base.digest: "{{ .BaseImageDigest }}"
      org.opencontainers.image.source: https://github.com/nivekalara237/localrectl
      org.opencontainers.image.url: https://github.com/nivekalara237/localrectl

# Keyless signature of the pushed image.
docker_signs:
  - cmd: cosign
    artifacts: manifests
    args: ["sign", "--yes", "${artifact}@${digest}"]

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^website:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: nivekalara237
    name: localrectl
  prerelease: auto
  footer: |
    **Docker image**:
    - `docker pull {{ .Env.DOCKERHUB_USERNAME }}/localrectl:{{ .Version }}`
    - `docker pull ghcr.io/nivekalara237/localrectl:{{ .Version }}`

    **Verify the checksums file** (Sigstore keyless signature):
    ```sh
    cosign verify-blob --bundle {{ .ProjectName }}_{{ .Version }}_checksums.txt.sigstore.json \
      --certificate-identity-regexp 'https://github.com/nivekalara237/localrectl/.github/workflows/release.yml@.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      {{ .ProjectName }}_{{ .Version }}_checksums.txt
    ```
